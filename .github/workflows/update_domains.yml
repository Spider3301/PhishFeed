name: Update domain list from external JSON

# run every 2 hours + manual trigger
on:
  schedule:
    - cron: '0 */2 * * *'    # at minute 0 every 2nd hour (12 times/day) - runs in UTC
  workflow_dispatch:

jobs:
  update_domains:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # keep credentials so we can push
          persist-credentials: true

      - name: Fetch external JSON
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/phishdestroy/destroylist/main/list.json' -o list.json

      - name: Install jq (JSON parsing)
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Convert JSON list to plain TXT (one domain per line, unique & sorted)
        run: |
          # if JSON is simple array of strings, this extracts them, removes blanks, sorts & uniques
          jq -r '.[]' list.json | sed '/^\s*$/d' | sort -u > domains.txt
          # If your JSON structure is different, change the jq expression above (see notes).
          true

      - name: Commit and push only if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add domains.txt
          # commit only if there are changes staged
          if git diff --cached --quiet; then
            echo "No changes to domains.txt — nothing to commit."
          else
            git commit -m "Update domains.txt from phishdestroy list.json"
            git push
          fi
