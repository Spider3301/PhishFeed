name: Update domain list from external JSON

# run every 2 hours + manual trigger
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Give the workflow explicit permission to write repository contents
permissions:
  contents: write

jobs:
  update_domains:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (with push credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # allow pushing with GITHUB_TOKEN
          fetch-depth: 0

      - name: Fetch external JSON
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/phishdestroy/destroylist/main/list.json' -o list.json

      - name: Install jq (JSON parsing)
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Convert JSON list to plain TXT (one domain per line, unique & sorted)
        run: |
          jq -r '.[]' list.json | sed '/^\s*$/d' | sort -u > domains.txt
          true

      - name: Commit and push only if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains.txt
          if git diff --cached --quiet; then
            echo "No changes to domains.txt — nothing to commit."
          else
            git commit -m "Update domains.txt from phishdestroy list.json"
            git push
          fi
